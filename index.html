<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo_basket.svg" />
    <!-- interactive-widget=resizes-content: on browsers that support it
         (Chrome 108+), the layout viewport itself shrinks for the on-screen
         keyboard instead of the browser panning the page to keep the
         focused input visible — see WhoAmIGame.tsx for the JS-based
         fallback needed on browsers (notably iOS Safari) that don't. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <title>HoopQuiz</title>

    <!-- PWA manifest -->
    <link rel="manifest" href="/nba-quiz-front/manifest.webmanifest" />
    <meta name="theme-color" content="#08080f" />

    <!-- iOS support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HoopQuiz" />
    <link rel="apple-touch-icon" href="/nba-quiz-front/pwa-192x192.png" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
